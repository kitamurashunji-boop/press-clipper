<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Press Clipper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:       #0d0e14;
  --surface:  #13141c;
  --border:   #1e2030;
  --border2:  #262840;
  --text:     #ffffff;
  --muted:    #9ba3c8;
  --muted2:   #6b72a0;
  --accent:   #c5f135;
  --accent-dim: rgba(197,241,53,0.12);
  --green:    #34d399;
  --blue:     #818cf8;
  --orange:   #fb923c;
  --r:        14px;
  --r-sm:     8px;
}
body {
  font-family:'Inter',-apple-system,sans-serif;
  background: linear-gradient(to bottom right, #0a0d2e 0%, #0f1020 45%, #111f00 75%, #1e3300 100%);
  background-attachment: fixed;
  color:var(--text); min-height:100vh; font-size:14px; line-height:1.5;
}
main, nav { position:relative; z-index:1; }

/* ── Nav ── */
nav {
  height:88px; display:flex; align-items:center; justify-content:space-between;
  padding:0 28px; background:var(--surface); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:100;
}
.nav-logo { display:flex; align-items:center; gap:10px; text-decoration:none; }
.nav-logo-mark {
  width:30px; height:30px; background:var(--accent); border-radius:7px;
  display:grid; place-items:center; font-weight:800; font-size:15px; color:#0d0e14; flex-shrink:0;
}
.nav-logo-text { font-weight:700; font-size:15px; color:var(--text); letter-spacing:-0.3px; }
.nav-pills { display:flex; gap:2px; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:4px; }
.nav-pill { padding:5px 14px; border-radius:7px; font-size:12px; font-weight:500; color:var(--muted); cursor:pointer; user-select:none; transition:all .15s; }
.nav-pill.active { background:var(--surface); color:var(--text); }
.nav-right { display:flex; align-items:center; gap:8px; }
.nav-icon { width:32px; height:32px; border-radius:8px; border:1px solid var(--border2); background:var(--surface); display:grid; place-items:center; cursor:pointer; color:var(--muted); font-size:15px; }

/* ── Layout ── */
main { max-width:1080px; margin:0 auto; padding:32px 28px 60px; }
.page-header { margin:0 -28px 0; }

/* ── Page header ── */
.page-header { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:24px; }
.page-eyebrow { font-size:11px; color:var(--muted); letter-spacing:1.5px; font-weight:600; text-transform:uppercase; margin-bottom:5px; }
.page-title { font-size:26px; font-weight:700; color:var(--text); letter-spacing:-0.5px; }

/* ── Card ── */
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); }

/* ── Input area ── */
.input-card { padding:24px; margin-bottom:20px; }
.input-label { font-size:12px; font-weight:600; color:var(--muted); letter-spacing:0.5px; text-transform:uppercase; margin-bottom:10px; }

/* Tab switcher */
.tab-bar { display:flex; gap:2px; background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:4px; width:fit-content; margin-bottom:16px; }
.tab-btn { padding:7px 18px; border-radius:6px; font-size:13px; font-weight:500; color:var(--muted); cursor:pointer; border:none; background:none; transition:all .15s; }
.tab-btn.active { background:var(--border2); color:var(--text); }

/* Input field */
.input-row { display:flex; gap:10px; }
.input-field {
  flex:1; background:var(--bg); border:1px solid var(--border); border-radius:10px;
  color:var(--text); font-size:14px; font-family:inherit; padding:11px 16px;
  outline:none; transition:border-color .15s;
}
.input-field:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(197,241,53,0.08); }
.input-field::placeholder { color:var(--muted2); }
.btn-primary {
  background:var(--accent); color:#0d0e14; border:none; border-radius:10px;
  font-size:13px; font-weight:700; font-family:inherit; padding:11px 22px;
  cursor:pointer; white-space:nowrap; transition:opacity .15s; letter-spacing:0.2px;
}
.btn-primary:hover { opacity:0.88; }
.btn-primary:disabled { opacity:0.4; cursor:not-allowed; }

/* File drop zone */
.dropzone {
  border:1.5px dashed var(--border2); border-radius:10px; padding:28px;
  text-align:center; cursor:pointer; transition:all .15s; position:relative;
}
.dropzone:hover, .dropzone.dragover { border-color:var(--accent); background:var(--accent-dim); }
.dropzone input[type=file] { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.dropzone-icon { font-size:28px; margin-bottom:8px; }
.dropzone-text { font-size:13px; color:var(--muted); }
.dropzone-text b { color:var(--text); }
.dropzone-sub { font-size:11px; color:var(--muted2); margin-top:4px; }
.file-selected { display:flex; align-items:center; gap:10px; background:var(--accent-dim); border:1px solid rgba(197,241,53,0.25); border-radius:10px; padding:12px 16px; }
.file-selected-name { font-size:13px; color:var(--accent); font-weight:500; flex:1; }
.file-clear { background:none; border:none; color:var(--muted); cursor:pointer; font-size:18px; line-height:1; padding:0 4px; }
.file-clear:hover { color:var(--text); }
#file-section { display:block; }
#url-section  { display:none; }

/* ── Progress ── */
.progress-card { padding:32px; margin-bottom:20px; display:none; }
.progress-layout { display:flex; align-items:center; gap:40px; }
.progress-left { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; min-width:180px; flex-shrink:0; }
.progress-spinner {
  width:52px; height:52px; border-radius:50%;
  border:4px solid var(--border2);
  border-top-color:var(--accent);
  animation:spin .9s linear infinite;
}
.progress-title { font-size:16px; font-weight:700; color:var(--text); letter-spacing:.5px; margin:0; text-align:center; line-height:1.4; }
.progress-steps { display:flex; flex-direction:column; gap:12px; flex:1; }
.step { display:flex; align-items:center; gap:14px; }
.step-dot { width:10px; height:10px; border-radius:50%; background:var(--muted2); flex-shrink:0; transition:background .3s; }
.step-dot.done { background:var(--accent); }
.step-dot.active { background:var(--accent); box-shadow:0 0 0 4px var(--accent-dim); animation:pulse 1s infinite; }
.step-text { font-size:14px; color:var(--muted); transition:color .3s; }
.step-text.active { color:var(--text); font-weight:600; }
.step-text.done { color:var(--muted); text-decoration:line-through; }
.progress-bar-wrap { margin-top:24px; background:var(--bg); border-radius:4px; height:6px; overflow:hidden; max-width:360px; margin-left:auto; margin-right:auto; }
.progress-bar-fill { height:100%; background:var(--accent); border-radius:4px; transition:width .6s ease; width:0%; box-shadow:0 0 8px var(--accent); }
@keyframes spin { to{transform:rotate(360deg)} }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.6;transform:scale(1.3)} }

/* ── Stats ── */
.stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
.stat-card { padding:20px; border-radius:var(--r); }
.stat-val { font-size:2.2rem; font-weight:700; line-height:1; margin-bottom:6px; }
.stat-lbl { font-size:11px; font-weight:600; color:var(--muted); letter-spacing:0.5px; display:flex; align-items:center; gap:6px; }
.stat-dot { width:7px; height:7px; border-radius:50%; display:inline-block; }

/* ── Results ── */
.results-card { padding:0; overflow:hidden; }
.results-header { display:flex; align-items:center; justify-content:space-between; padding:18px 24px; border-bottom:1px solid var(--border); }
.results-title { font-size:15px; font-weight:600; color:var(--text); }
.results-count { font-size:12px; color:var(--muted); font-weight:500; }
.results-actions { display:flex; gap:8px; align-items:center; }
.btn-download {
  background:var(--accent); color:#0d0e14; border:none; border-radius:8px;
  font-size:12px; font-weight:700; font-family:inherit; padding:7px 16px;
  cursor:pointer; transition:opacity .15s; letter-spacing:0.2px;
}
.btn-download:hover { opacity:0.88; }

/* Filter pills */
.filter-bar { display:flex; gap:6px; padding:14px 24px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.filter-pill { padding:4px 12px; border-radius:20px; font-size:11px; font-weight:600; cursor:pointer; border:1px solid transparent; transition:all .15s; }
.filter-pill.all { background:rgba(255,255,255,0.08); color:var(--text); border-color:var(--border2); }
.filter-pill.f1 { background:rgba(197,241,53,0.1); color:var(--accent); border-color:rgba(197,241,53,0.25); }
.filter-pill.f2 { background:rgba(52,211,153,0.1); color:var(--green); border-color:rgba(52,211,153,0.25); }
.filter-pill.fw { background:rgba(129,140,248,0.1); color:var(--blue); border-color:rgba(129,140,248,0.25); }
.filter-pill.fs { background:rgba(251,146,60,0.1); color:var(--orange); border-color:rgba(251,146,60,0.25); }
.filter-pill.active { opacity:1; } .filter-pill:not(.active) { opacity:0.45; }

/* Article table */
.article-table { width:100%; border-collapse:collapse; }
.article-table th { font-size:10px; font-weight:600; color:var(--muted); letter-spacing:1px; text-transform:uppercase; padding:10px 20px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap; }
.article-table td { padding:14px 20px; border-bottom:1px solid var(--border); vertical-align:middle; }
.article-table tr:last-child td { border-bottom:none; }
.article-table tbody tr { transition:background .1s; }
.article-table tbody tr:hover td { background:rgba(255,255,255,0.02); }

.badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:10px; font-weight:700; letter-spacing:0.3px; }
.badge-1 { background:rgba(197,241,53,0.12); color:var(--accent); }
.badge-2 { background:rgba(52,211,153,0.12); color:var(--green); }
.badge-w { background:rgba(129,140,248,0.12); color:var(--blue); }
.badge-s { background:rgba(251,146,60,0.12); color:var(--orange); }

.article-title { font-size:13px; font-weight:500; color:var(--text); text-decoration:none; display:block; margin-bottom:3px; }
.article-title:hover { color:var(--accent); }
.article-snippet { font-size:11px; color:var(--muted); line-height:1.5; }
.media-tag { display:inline-block; background:rgba(255,255,255,0.05); border:1px solid var(--border2); color:var(--muted); border-radius:6px; font-size:11px; font-weight:500; padding:2px 8px; }
.date-text { font-size:11px; color:var(--muted2); }

/* Summary card */
.summary-card { padding:20px 24px; margin-bottom:20px; }
.summary-header { display:flex; gap:24px; margin-bottom:14px; }
.summary-field label { font-size:10px; color:var(--muted); font-weight:600; letter-spacing:0.8px; text-transform:uppercase; display:block; margin-bottom:3px; }
.summary-field span { font-size:13px; font-weight:500; color:var(--text); }
.summary-text { font-size:13px; color:var(--muted); line-height:1.7; padding:14px 16px; background:var(--bg); border-radius:8px; border-left:3px solid var(--accent); }
.kw-pills { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
.kw-pill { background:var(--accent-dim); color:var(--accent); border:1px solid rgba(197,241,53,0.2); border-radius:20px; font-size:11px; font-weight:500; padding:3px 10px; }

/* Engine badge */
.engine-badge { font-size:11px; color:var(--muted); background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:3px 8px; }

/* Empty / error states */
.empty-state { text-align:center; padding:48px 24px; color:var(--muted); }
.empty-state .icon { font-size:36px; margin-bottom:12px; opacity:0.4; }
.empty-state p { font-size:13px; }
.error-box { background:rgba(239,68,68,0.08); border:1px solid rgba(239,68,68,0.2); border-radius:10px; padding:14px 18px; color:#f87171; font-size:13px; margin-bottom:16px; }

/* ── History ── */
.history-grid { display:flex; flex-direction:column; gap:10px; }
.history-item {
  display:grid; grid-template-columns:1fr auto;
  align-items:center; gap:16px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  padding:18px 22px; transition:border-color .15s; cursor:default;
}
.history-item:hover { border-color:var(--border2); }
.history-meta { font-size:11px; color:var(--muted); margin-bottom:5px; }
.history-title { font-size:14px; font-weight:600; color:var(--text); margin-bottom:6px; }
.history-pills { display:flex; gap:6px; flex-wrap:wrap; }
.history-pill { font-size:11px; font-weight:600; padding:2px 9px; border-radius:20px; }
.history-actions { display:flex; gap:8px; align-items:center; }
.btn-sm {
  background:var(--accent-dim); color:var(--accent); border:1px solid rgba(197,241,53,0.2);
  border-radius:7px; font-size:12px; font-weight:600; font-family:inherit;
  padding:6px 14px; cursor:pointer; transition:opacity .15s; white-space:nowrap;
}
.btn-sm:hover { opacity:0.8; }
.btn-sm-danger {
  background:rgba(239,68,68,0.08); color:#f87171; border:1px solid rgba(239,68,68,0.15);
  border-radius:7px; font-size:12px; font-weight:600; font-family:inherit;
  padding:6px 10px; cursor:pointer; transition:opacity .15s;
}
.btn-sm-danger:hover { opacity:0.8; }
</style>
</head>
<body>

<!-- Nav -->
<nav>
  <a href="/" style="display:flex;align-items:center;">
    <img src="/static/AUR_LOGO.png" alt="AUR" style="height:58px;object-fit:contain;">
  </a>
  <div class="nav-pills">
    <div class="nav-pill active" onclick="showPage('clip')"><i data-lucide="scissors" style="width:13px;height:13px;vertical-align:-2px;margin-right:5px;"></i>クリッピング</div>
    <div class="nav-pill" onclick="showPage('history')"><i data-lucide="clock" style="width:13px;height:13px;vertical-align:-2px;margin-right:5px;"></i>レポート履歴</div>
  </div>
  <div class="nav-right">
    <div class="nav-icon">⚙</div>
  </div>
</nav>

<main>
  <!-- Page header -->
  <div id="page-header" class="page-header">
    <div style="width:100%;overflow:hidden;">
      <img src="/static/logo2.png" alt="Press Clipper"
        style="width:70%;display:block;margin-top:-154px;margin-bottom:-189px;margin-left:auto;margin-right:auto;">
    </div>
  </div>

  <!-- Error -->
  <div id="error-box" class="error-box" style="display:none;"></div>

  <!-- Input card -->
  <div class="card input-card" id="input-card">
    <div class="input-label">プレスリリースを入力</div>

    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('url')"><i data-lucide="link" style="width:13px;height:13px;vertical-align:-2px;margin-right:5px;"></i>PR TIMESのURL</button>
      <button class="tab-btn" onclick="switchTab('file')"><i data-lucide="paperclip" style="width:13px;height:13px;vertical-align:-2px;margin-right:5px;"></i>ファイルをアップロード</button>
    </div>

    <!-- URL section -->
    <div id="url-section" style="display:block;">
      <div class="input-row">
        <input class="input-field" id="url-input" type="text"
          placeholder="https://prtimes.jp/main/html/rd/p/..."
          onkeydown="if(event.key==='Enter') startAnalysis()">
        <button class="btn-primary" id="analyze-btn" onclick="startAnalysis()">解析・検索を開始 →</button>
      </div>
    </div>

    <!-- File section -->
    <div id="file-section" style="display:none;">
      <div id="dropzone" class="dropzone" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
        <input type="file" id="file-input" accept=".txt,.pdf,.docx" onchange="onFileSelect(event)">
        <div class="dropzone-icon">📄</div>
        <div class="dropzone-text"><b>クリックまたはドラッグ</b>でファイルをアップロード</div>
        <div class="dropzone-sub">対応形式：PDF / Word (.docx) / テキスト (.txt)</div>
      </div>
      <div id="file-selected" class="file-selected" style="display:none;">
        <span>📄</span>
        <span class="file-selected-name" id="file-name"></span>
        <button class="file-clear" onclick="clearFile()">✕</button>
      </div>
      <div style="margin-top:12px; display:flex; justify-content:flex-end;">
        <button class="btn-primary" id="analyze-btn-file" onclick="startAnalysis()" disabled>解析・検索を開始 →</button>
      </div>
    </div>
  </div>

  <!-- Progress card -->
  <div class="card progress-card" id="progress-card">
    <div class="progress-layout">
      <div class="progress-left">
        <div class="progress-spinner"></div>
        <div class="progress-title">解析・検索中...</div>
      </div>
      <div class="progress-steps">
      <div class="step"><div class="step-dot" id="dot-0"></div><div class="step-text" id="text-0">プレスリリースを読み込み中</div></div>
      <div class="step"><div class="step-dot" id="dot-1"></div><div class="step-text" id="text-1">Claudeで内容を解析中</div></div>
      <div class="step"><div class="step-dot" id="dot-2"></div><div class="step-text" id="text-2">Web検索で掲載記事を収集中</div></div>
      <div class="step"><div class="step-dot" id="dot-3"></div><div class="step-text" id="text-3">AIで記事を分類・判定中</div></div>
      <div class="step"><div class="step-dot" id="dot-4"></div><div class="step-text" id="text-4">レポートを生成中</div></div>
      </div>
    </div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-bar"></div></div>
  </div>

  <!-- Results (always visible) -->
  <div id="results">

    <!-- Summary card -->
    <div class="card summary-card" id="summary-card">
      <div class="summary-header">
        <div class="summary-field"><label>会社名</label><span id="res-company">—</span></div>
        <div class="summary-field"><label>製品・サービス</label><span id="res-product">—</span></div>
        <div class="summary-field"><label>発表日</label><span id="res-date">—</span></div>
      </div>
      <div class="summary-text" id="res-summary" style="color:var(--muted2);">解析結果がここに表示されます</div>
      <div class="kw-pills" id="res-keywords"></div>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="card stat-card">
        <i data-lucide="pen-line" style="width:18px;height:18px;color:var(--accent);margin-bottom:8px;display:block;"></i>
        <div class="stat-val" style="color:var(--accent);" id="stat-primary">0</div>
        <div class="stat-lbl"><span class="stat-dot" style="background:var(--accent);"></span>1次記事</div>
      </div>
      <div class="card stat-card">
        <i data-lucide="copy" style="width:18px;height:18px;color:var(--green);margin-bottom:8px;display:block;"></i>
        <div class="stat-val" style="color:var(--green);" id="stat-secondary">0</div>
        <div class="stat-lbl"><span class="stat-dot" style="background:var(--green);"></span>2次記事</div>
      </div>
      <div class="card stat-card">
        <i data-lucide="radio" style="width:18px;height:18px;color:var(--blue);margin-bottom:8px;display:block;"></i>
        <div class="stat-val" style="color:var(--blue);" id="stat-wire">0</div>
        <div class="stat-lbl"><span class="stat-dot" style="background:var(--blue);"></span>ワイヤー</div>
      </div>
      <div class="card stat-card">
        <i data-lucide="share-2" style="width:18px;height:18px;color:var(--orange);margin-bottom:8px;display:block;"></i>
        <div class="stat-val" style="color:var(--orange);" id="stat-sns">0</div>
        <div class="stat-lbl"><span class="stat-dot" style="background:var(--orange);"></span>SNS</div>
      </div>
    </div>

    <!-- Article list -->
    <div class="card results-card">
      <div class="results-header">
        <div>
          <div class="results-title">掲載記事一覧</div>
        </div>
        <div class="results-actions">
          <span class="engine-badge" id="engine-badge"></span>
          <span class="results-count" id="results-count"></span>
          <button class="btn-download" id="download-btn" onclick="downloadReport()" style="display:none;">レポートをダウンロード</button>
        </div>
      </div>

      <div class="filter-bar">
        <span class="filter-pill all active" onclick="filterArticles('all', this)">すべて</span>
        <span class="filter-pill f1" onclick="filterArticles('1次記事', this)">1次記事</span>
        <span class="filter-pill f2" onclick="filterArticles('2次記事', this)">2次記事</span>
        <span class="filter-pill fw" onclick="filterArticles('ワイヤーサービス', this)">ワイヤー</span>
        <span class="filter-pill fs" onclick="filterArticles('SNS', this)">SNS</span>
      </div>

      <div id="article-list">
        <table class="article-table">
          <thead>
            <tr>
              <th style="width:80px;">種別</th>
              <th style="width:90px;">掲載日</th>
              <th>記事タイトル</th>
              <th style="width:140px;">媒体名</th>
            </tr>
          </thead>
          <tbody id="article-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ── History page ── -->
  <div id="page-history" style="display:none;">
    <div class="page-header" style="margin-bottom:24px;">
      <div>
        <div class="page-eyebrow">過去の解析結果</div>
        <div class="page-title">レポート履歴</div>
      </div>
      <button class="btn-sm-danger" onclick="clearAllHistory()" style="align-self:center;">すべて削除</button>
    </div>
    <div id="history-list" class="history-grid"></div>
  </div>

</main>

<script>
let currentTab = 'url';
let selectedFile = null;
let allArticles = [];
let htmlReport = '';
let reportStem = 'クリッピング';

// ── Page switching ────────────────────────────────────────────────────────
let clipState = 'input'; // 'input' | 'progress' | 'results'

function showPage(page) {
  const isClip = page === 'clip';
  document.getElementById('page-history').style.display  = isClip ? 'none' : 'block';
  document.getElementById('page-header').style.display   = isClip ? ''     : 'none';
  document.getElementById('error-box').style.display     = 'none';
  document.getElementById('input-card').style.display    = isClip ? (clipState === 'progress' ? 'none' : '') : 'none';
  document.getElementById('progress-card').style.display = isClip && clipState === 'progress' ? '' : 'none';
  document.getElementById('results').style.display       = isClip ? '' : 'none';
  document.querySelectorAll('.nav-pill').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-pill')[isClip ? 0 : 1].classList.add('active');
  if (!isClip) renderHistory();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('url-section').style.display = tab === 'url' ? 'block' : 'none';
  document.getElementById('file-section').style.display = tab === 'file' ? 'block' : 'none';
}

// ── History (localStorage) ────────────────────────────────────────────────
const HISTORY_KEY = 'pc_history';
const MAX_HISTORY = 30;

function saveHistory(data) {
  const history = loadHistory();
  const entry = {
    id: Date.now(),
    analyzedAt: new Date().toISOString(),
    source: data.source_name || '',
    company: data.info.company || '—',
    product: data.info.product || '—',
    releaseDate: data.info.release_date || '',
    stats: data.stats,
    htmlReport: data.html_report,
  };
  history.unshift(entry);
  if (history.length > MAX_HISTORY) history.splice(MAX_HISTORY);
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch(e) {}
}

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch { return []; }
}

function deleteHistory(id) {
  const history = loadHistory().filter(h => h.id !== id);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  renderHistory();
}

function clearAllHistory() {
  if (!confirm('履歴をすべて削除しますか？')) return;
  localStorage.removeItem(HISTORY_KEY);
  renderHistory();
}

function downloadHistoryReport(id) {
  const entry = loadHistory().find(h => h.id === id);
  if (!entry) return;
  const blob = new Blob([entry.htmlReport], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const stem = entry.source.replace(/^https?:\/\//, '').replace(/[^a-zA-Z0-9ぁ-んァ-ン一-龯]/g, '_').slice(0, 40) || 'クリッピング';
  a.download = `${stem}_クリッピングレポート.html`;
  a.click();
}

function renderHistory() {
  const history = loadHistory();
  const container = document.getElementById('history-list');
  if (!history.length) {
    container.innerHTML = `<div class="empty-state"><div class="icon">📋</div><p>履歴がありません。<br>クリッピングを実行すると自動的に保存されます。</p></div>`;
    return;
  }
  container.innerHTML = history.map(h => {
    const dt = new Date(h.analyzedAt);
    const dateStr = `${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
    const src = h.source.length > 60 ? h.source.slice(0,60)+'…' : h.source;
    const s = h.stats || {};
    return `<div class="history-item">
      <div>
        <div class="history-meta">${dateStr}　|　${escHtml(src)}</div>
        <div class="history-title">${escHtml(h.company)}　<span style="color:var(--muted);font-weight:400;">／</span>　${escHtml(h.product)}</div>
        <div class="history-pills">
          <span class="history-pill badge-1">1次 ${s.primary||0}</span>
          <span class="history-pill badge-2">2次 ${s.secondary||0}</span>
          <span class="history-pill badge-w">Wire ${s.wire||0}</span>
          <span class="history-pill badge-s">SNS ${s.sns||0}</span>
          <span style="font-size:11px;color:var(--muted);align-self:center;">計 ${s.total||0}件</span>
        </div>
      </div>
      <div class="history-actions">
        <button class="btn-sm" onclick="downloadHistoryReport(${h.id})">ダウンロード</button>
        <button class="btn-sm-danger" onclick="deleteHistory(${h.id})">✕</button>
      </div>
    </div>`;
  }).join('');
}

function onDragOver(e) { e.preventDefault(); document.getElementById('dropzone').classList.add('dragover'); }
function onDragLeave() { document.getElementById('dropzone').classList.remove('dragover'); }
function onDrop(e) {
  e.preventDefault();
  document.getElementById('dropzone').classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) setFile(file);
}
function onFileSelect(e) { const f = e.target.files[0]; if (f) setFile(f); }
function setFile(file) {
  selectedFile = file;
  document.getElementById('dropzone').style.display = 'none';
  document.getElementById('file-selected').style.display = 'flex';
  document.getElementById('file-name').textContent = file.name;
  document.getElementById('analyze-btn-file').disabled = false;
}
function clearFile() {
  selectedFile = null;
  document.getElementById('dropzone').style.display = 'block';
  document.getElementById('file-selected').style.display = 'none';
  document.getElementById('file-input').value = '';
  document.getElementById('analyze-btn-file').disabled = true;
}

function setProgress(step, pct) {
  for (let i = 0; i < 5; i++) {
    const dot = document.getElementById(`dot-${i}`);
    const txt = document.getElementById(`text-${i}`);
    dot.className = 'step-dot' + (i < step ? ' done' : i === step ? ' active' : '');
    txt.className = 'step-text' + (i < step ? ' done' : i === step ? ' active' : '');
  }
  document.getElementById('progress-bar').style.width = pct + '%';
}

async function startAnalysis() {
  const url = document.getElementById('url-input').value.trim();
  if (currentTab === 'url' && !url.startsWith('http')) {
    showError('有効なURLを入力してください');
    return;
  }
  if (currentTab === 'file' && !selectedFile) {
    showError('ファイルを選択してください');
    return;
  }

  hideError();
  clipState = 'progress';
  document.getElementById('input-card').style.display = 'none';
  document.getElementById('progress-card').style.display = 'block';

  setProgress(0, 10);
  await delay(400);
  setProgress(1, 30);

  const formData = new FormData();
  if (currentTab === 'file') {
    formData.append('file', selectedFile);
    reportStem = selectedFile.name.replace(/\.[^.]+$/, '');
  } else {
    formData.append('url', url);
    reportStem = 'クリッピング';
  }

  try {
    setProgress(2, 50);
    const res = await fetch('/api/analyze', { method: 'POST', body: formData });
    setProgress(3, 75);
    await delay(300);

    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || 'サーバーエラー');
    }

    const data = await res.json();
    setProgress(4, 95);
    await delay(400);

    renderResults(data);
  } catch (e) {
    clipState = 'input';
    document.getElementById('progress-card').style.display = 'none';
    document.getElementById('input-card').style.display = '';
    showError('エラー: ' + e.message);
  }
}

function renderResults(data) {
  clipState = 'results';
  document.getElementById('progress-card').style.display = 'none';
  document.getElementById('input-card').style.display = '';
  document.getElementById('download-btn').style.display = '';

  // Summary
  document.getElementById('res-company').textContent = data.info.company || '—';
  document.getElementById('res-product').textContent = data.info.product || '—';
  document.getElementById('res-date').textContent = data.info.release_date || '—';
  document.getElementById('res-summary').textContent = data.info.summary || '';
  const kwEl = document.getElementById('res-keywords');
  kwEl.innerHTML = (data.info.keywords || []).map(k => `<span class="kw-pill">${k}</span>`).join('');

  // Stats
  document.getElementById('stat-primary').textContent = data.stats.primary;
  document.getElementById('stat-secondary').textContent = data.stats.secondary;
  document.getElementById('stat-wire').textContent = data.stats.wire;
  document.getElementById('stat-sns').textContent = data.stats.sns;

  // Engine
  document.getElementById('engine-badge').textContent = `🔍 ${data.search_engine}`;
  document.getElementById('results-count').textContent = `${data.stats.total} 件`;

  // Articles
  allArticles = data.articles;
  htmlReport = data.html_report;
  renderTable(allArticles);

  // Reset filter
  document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
  document.querySelector('.filter-pill.all').classList.add('active');

  // Save to history
  saveHistory(data);

  // Scroll to results
  document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

const BADGE = {
  '1次記事':      ['badge badge-1', '1次'],
  '2次記事':      ['badge badge-2', '2次'],
  'ワイヤーサービス': ['badge badge-w', 'Wire'],
  'SNS':          ['badge badge-s', 'SNS'],
};

function renderTable(articles) {
  const tbody = document.getElementById('article-tbody');
  if (!articles.length) {
    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:40px;color:var(--muted);">記事が見つかりませんでした</td></tr>`;
    return;
  }
  tbody.innerHTML = articles.map(a => {
    const [cls, lbl] = BADGE[a.article_class] || ['badge', a.article_class];
    const date = (a.date || '').slice(0, 10) || '—';
    const title = escHtml(a.title || '');
    const snippet = escHtml((a.snippet || '').slice(0, 90));
    const media = escHtml(a.media || '');
    return `<tr>
      <td><span class="${cls}">${lbl}</span></td>
      <td><span class="date-text">${date}</span></td>
      <td>
        <a class="article-title" href="${escHtml(a.url)}" target="_blank" rel="noopener">${title}</a>
        ${snippet ? `<div class="article-snippet">${snippet}</div>` : ''}
      </td>
      <td><span class="media-tag">${media}</span></td>
    </tr>`;
  }).join('');
}

function filterArticles(cls, el) {
  document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  const filtered = cls === 'all' ? allArticles : allArticles.filter(a => a.article_class === cls);
  renderTable(filtered);
}

function downloadReport() {
  const blob = new Blob([htmlReport], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${reportStem}_クリッピングレポート.html`;
  a.click();
}

function showError(msg) {
  const el = document.getElementById('error-box');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideError() { document.getElementById('error-box').style.display = 'none'; }
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
<script>lucide.createIcons();</script>
</body>
</html>
